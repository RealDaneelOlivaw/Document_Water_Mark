[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-watermark-tool"
version = "0.1.0"
description = "Batch add text watermark to pictures inside PPT, Word, and PDF files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow",
  "python-pptx",
  "python-docx",
  "pymupdf",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ppt-watermark = "ppt_watermark.cli:run"
ppt-watermark-gui = "ppt_watermark.gui:main"
